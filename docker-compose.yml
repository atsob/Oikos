# network_mode: host is used throughout — Postgres and (optionally) Ollama are
# assumed to be reachable at localhost, i.e. running directly on this same
# server rather than in their own containers. This is Linux-only (Docker
# Desktop on Mac/Windows doesn't support host networking the same way); if
# you're on one of those, switch to a bridge network with explicit `ports:`
# mappings and point DB_HOST/OLLAMA_IP at host.docker.internal instead.
services:

  oikos:
    build:
      context: .
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
        GIT_DATE: ${GIT_DATE:-}
    image: oikos:latest
    container_name: oikos
    network_mode: host
    environment:
      - DB_NAME=${DB_NAME:-Oikos}
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env — see .env.example}
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=${DB_PORT:-5432}
      - DB_TIMEZONE=${DB_TIMEZONE:-Europe/Athens}
      - APP_DATA_DIR=/app
      - OLLAMA_IP=${OLLAMA_IP:-127.0.0.1}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - PERSIST_DIR=/app/storage_rag
      - EODHD_API_KEY=${EODHD_API_KEY:-}
      # First-login account, created once if the Users table is empty — see .env.example.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ${BACKUP_DIR:-./database_backups}:/app/database_backups
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080 --workers 3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  oikos_https:
    image: nginx:alpine
    container_name: oikos_https
    network_mode: host
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro
      - ./ssl/rootCA.pem:/etc/nginx/ssl/rootCA.pem:ro
    depends_on:
      - oikos
    restart: unless-stopped

  # Doesn't run the FastAPI app (no HTTP, no auth/lifespan), so no ADMIN_* vars here.
  oikos_scheduler:
    build:
      context: .
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
        GIT_DATE: ${GIT_DATE:-}
    image: oikos:latest
    container_name: oikos_scheduler
    network_mode: host
    environment:
      - DB_NAME=${DB_NAME:-Oikos}
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env — see .env.example}
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=${DB_PORT:-5432}
      - DB_TIMEZONE=${DB_TIMEZONE:-Europe/Athens}
      - APP_DATA_DIR=/app
      - OLLAMA_IP=${OLLAMA_IP:-127.0.0.1}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - PERSIST_DIR=/app/storage_rag
      - EODHD_API_KEY=${EODHD_API_KEY:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ${BACKUP_DIR:-./database_backups}:/app/database_backups
    command: python scheduler.py
    restart: unless-stopped

