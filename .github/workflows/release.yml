# Builds, checks, scans and pushes atsob/oikos for amd64 and arm64 when a release tag is pushed:
#   scripts/next_version.sh                 prints the next version, e.g. v2026-10-26.0
#   git tag v2026-10-26.0 && git push origin v2026-10-26.0
# Versions are vYYYY-MM-DD.HF — the date of the release and its hot fix number, 0 for the first release of a day, then 1, 2 …
# Docker Hub tags produced: v2026-10-26.0 and latest. The version is built into the app (sidebar footer, /api/health).
#
# One-time setup in GitHub -> Settings -> Secrets and variables -> Actions:
#   DOCKERHUB_USERNAME  atsob
#   DOCKERHUB_TOKEN     a Docker Hub access token with Read & Write scope
name: Release image

on:
  push:
    tags: ['v[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: atsob/oikos
  MAX_APP_MB: 150
  TRUFFLEHOG_IMAGE: trufflesecurity/trufflehog:3.99.7

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Check the version tag
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$'; then
            echo "::error::'$GITHUB_REF_NAME' is not a release version — use vYYYY-MM-DD.HF, e.g. v2026-10-26.0"; exit 1
          fi

      - name: Build information
        id: info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cd --date=short)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 1. Native amd64 copy, loaded locally for checking (nothing is pushed yet)
      - name: Build a copy for checking
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: oikos-scan:ci
          build-args: |
            GIT_HASH=${{ steps.info.outputs.hash }}
            GIT_DATE=${{ steps.info.outputs.date }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Forbidden-files check
        run: |
          bad=$(docker run --rm --entrypoint sh oikos-scan:ci -c \
            'find /app -type f \( -name "*.dump" -o -name "*.sql.gz" -o -name "*.backup" -o -name "*.bak" \
               -o -name ".env" -o -name "*.env" -o -name ".env.*" -o -name "*.key" -o -name "*.pem" -o -name "*.p12" -o -name "*.pfx" \) -print' || true)
          if [ -n "$bad" ]; then
            echo "::error::Files that must never ship are in the image:"; echo "$bad"; exit 1
          fi
          app_mb=$(docker run --rm --entrypoint sh oikos-scan:ci -c 'du -sm /app | cut -f1')
          if [ "$app_mb" -gt "$MAX_APP_MB" ]; then
            echo "::error::/app is ${app_mb} MB (limit ${MAX_APP_MB} MB)"
            docker run --rm --entrypoint sh oikos-scan:ci -c 'du -sm /app/* | sort -rn | head'
            exit 1
          fi
          echo "No forbidden files; /app is ${app_mb} MB"

      # Two scans, because the image is mostly other people's files (Debian package lists, Python libraries) full of strings that merely look
      # like keys - the first run reported 180 such "unverified" results, none of them in /app and none verified as live.
      #  a) the whole image: fails only on a secret that TruffleHog verifies as live;
      #  b) our own files (/app): fails on any finding at all, verified or not.
      - name: Secret scan of the whole image (TruffleHog, verified secrets only)
        run: |
          docker save oikos-scan:ci -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" "$TRUFFLEHOG_IMAGE" \
            docker --image file:///image.tar --results=verified --fail --no-update

      - name: Secret scan of our own files in /app (TruffleHog, any finding)
        run: |
          cid=$(docker create oikos-scan:ci)
          docker cp "$cid:/app" "$RUNNER_TEMP/app"
          docker rm "$cid" >/dev/null
          docker run --rm -v "$RUNNER_TEMP/app:/scan:ro" "$TRUFFLEHOG_IMAGE" \
            filesystem /scan --fail --no-update

      # 2. Both architectures, pushed only if the checks above passed
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_HASH=${{ steps.info.outputs.hash }}
            GIT_DATE=${{ steps.info.outputs.date }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show the published platforms
        run: docker buildx imagetools inspect "$IMAGE:${{ github.ref_name }}" | grep 'Platform:' | grep -v unknown